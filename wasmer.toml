[package]
name = "llm/opencode-proxy"
version = "0.1.1"
description = "OpenCode API proxy (muse geogate bypass) running on WinterJS"

[dependencies]
"wasmer/winterjs" = "*"

[fs]
"/src" = "./src"

[[command]]
name = "script"
module = "wasmer/winterjs:winterjs"
runner = "https://webc.org/runner/wasi"

[command.annotations.wasi]
main-args = ["serve", "/src/index.js", "--script"]
