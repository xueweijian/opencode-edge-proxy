name: Probe wasmer login capabilities

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wasmer CLI
        run: |
          curl https://get.wasmer.io -sSfL | sh
          echo "$HOME/.wasmer/bin" >> $GITHUB_PATH

      - name: Probe login options
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          set +e
          {
            echo "### wasmer --version"
            wasmer --version 2>&1
            echo
            echo "### wasmer login --help"
            wasmer login --help 2>&1
            echo
            echo "### wasmer --help"
            wasmer --help 2>&1
            echo
            echo "### wasmer config --help"
            wasmer config --help 2>&1
            echo
            echo "### token len"
            echo ${#WASMER_TOKEN}
            echo "### token prefix"
            echo "$WASMER_TOKEN" | cut -c1-6
          } > /tmp/probe.log 2>&1
          cat /tmp/probe.log

      - name: Commit probe log
        run: |
          cp /tmp/probe.log ./probe.log || echo "no log" > ./probe.log
          git config user.email "ci@github.com"
          git config user.name "ci-bot"
          git add -f probe.log
          git commit -m "ci: probe log [skip ci]" || echo "nothing"
          git push || echo "push failed"
