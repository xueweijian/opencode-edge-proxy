name: Deploy to Wasmer Edge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wasmer CLI
        run: |
          curl https://get.wasmer.io -sSfL | sh
          echo "$HOME/.wasmer/bin" >> $GITHUB_PATH

      - name: Verify Wasmer CLI and token
        run: |
          wasmer --version
          echo "--- whoami ---"
          wasmer whoami || true
          echo "--- login check ---"
          wasmer login --help 2>&1 | head -20

      - name: Show project files
        run: |
          ls -la
          echo '--- wasmer.toml ---'
          cat wasmer.toml
          echo '--- app.yaml ---'
          cat app.yaml

      - name: Deploy to Wasmer Edge
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
          RUST_LOG: debug
        run: |
          set +e
          wasmer deploy --non-interactive --owner llm --app-name opencode-proxy 2>&1 | tee /tmp/deploy.log
          EXIT=$?
          echo "=== EXIT CODE: $EXIT ==="
          echo "=== LOG TAIL ==="
          tail -60 /tmp/deploy.log
          exit $EXIT
