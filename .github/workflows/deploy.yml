name: Deploy to Wasmer Edge

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: wasmer-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wasmer CLI
        run: |
          curl https://get.wasmer.io -sSfL | sh
          echo "$HOME/.wasmer/bin" >> $GITHUB_PATH

      - name: Bump package version
        id: bump
        run: |
          # Wasmer rejects re-publishing an existing package version, so every
          # deploy needs a fresh patch number derived from the CI run number.
          VERSION="0.2.${{ github.run_number }}"
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" wasmer.toml
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          grep '^version' wasmer.toml

      - name: Deploy
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          wasmer login "$WASMER_TOKEN" --no-browser
          wasmer whoami
          wasmer deploy --non-interactive --owner llm --app-name opencode-proxy
          # surface the live URL in the run summary
          echo "### Deployed \`${{ steps.bump.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "https://wasmer.1ciyuan.cn" >> $GITHUB_STEP_SUMMARY
