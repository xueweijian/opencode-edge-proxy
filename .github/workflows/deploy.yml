name: Deploy to Wasmer Edge

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Wasmer CLI
        run: |
          curl https://get.wasmer.io -sSfL | sh
          echo "$HOME/.wasmer/bin" >> $GITHUB_PATH

      - name: Verify Wasmer CLI and token
        run: |
          wasmer --version
          echo "--- whoami ---"
          wasmer whoami 2>&1 || true

      - name: Show project files
        run: |
          ls -la
          echo '--- wasmer.toml ---'
          cat wasmer.toml
          echo '--- app.yaml ---'
          cat app.yaml

      - name: Deploy to Wasmer Edge
        id: deploy
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
          RUST_LOG: debug
        run: |
          set +e
          wasmer deploy --non-interactive --owner llm --app-name opencode-proxy > /tmp/deploy.log 2>&1
          EXIT=$?
          echo "exit=$EXIT" >> $GITHUB_OUTPUT
          {
            echo "## Deploy result: exit=$EXIT"
            echo '```'
            cat /tmp/deploy.log
            echo '```'
            echo "## wasmer app list"
            echo '```'
            wasmer app list 2>&1 || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          exit $EXIT
